name: Nabu
description: Nabu is an AI-powered customs clearance platform that automates international trade
  compliance end to end. It collects shipment data from emails, PDFs, Excel files, databases, and
  TMS records via API, EDI, SFTP, or email, prepares complete compliant customs files, and generates
  pre-filled import/export declarations ready for submission in standard customs software. Nabu targets
  customs brokers and declaration teams, offering autonomous processing, workload flexibility to absorb
  staffing gaps, and full auditability across multiple regions and local regulatory regimes. Backed
  by Techstars. No public developer API, documentation, or SDKs are published at this time.
